# Run only the Kairon image against a hosted Supabase project (keys in .env):
#   docker compose -f docker-compose.cloud.yml up --build
# Run the SQL migration in the Supabase SQL Editor and seed users first (see README).
services:
  app:
    build: .
    env_file: .env
    environment:
      PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped
