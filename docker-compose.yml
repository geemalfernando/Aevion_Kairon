# docker compose up  →  PostgreSQL + Kairon (API and web app) on http://localhost:8080
# The first boot creates the schema and seeds the network, fleet, calendar, one delivery day and four accounts.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kairon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kairon}
      POSTGRES_DB: ${POSTGRES_DB:-kairon}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Exposed for local development and inspection only.
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kairon}:${POSTGRES_PASSWORD:-kairon}@db:5432/${POSTGRES_DB:-kairon}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-before-deploying}
      DEMO_MODE: ${DEMO_MODE:-true}
      RESEED_ON_BOOT: ${RESEED_ON_BOOT:-false}
      TOKEN_TTL_HOURS: ${TOKEN_TTL_HOURS:-12}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
