# Whole product on one machine, no accounts or .env needed:
#   docker compose up
# then open http://localhost:8080 and sign in with a demo account below.
#
#   frontend          nginx serving the web app on :8080, forwarding /api to the backend
#   backend           Kairon API: creates the demo accounts, imports data/ if the CSVs are there
#   database          Supabase Postgres with supabase/migrations applied
#   auth, database-api, supabase-gateway
#                     Supabase Auth (GoTrue) and REST (PostgREST) behind one origin, as hosted Supabase
# Every secret here is a local-only default. Never reuse them for a hosted deployment
# (for hosted Supabase use docker-compose.cloud.yml).
name: kairon

x-local-secrets:
  # Shared HS256 secret for the local Auth and REST services; the two keys below are signed with it.
  jwt-secret: &jwt-secret kairon-local-only-jwt-secret-change-me-0000
  anon-key: &anon-key eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzkwMDAwMDAwLCJleHAiOjIxMDUwMDAwMDB9.6XzcLPAFJQJd-uXncMSl7pwoK-jcpjsJTCSA_NmsOx0
  service-key: &service-key eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE3OTAwMDAwMDAsImV4cCI6MjEwNTAwMDAwMH0.VMATpDE0FUswvDwPo_ryGwa4mJTJ2boj-ZuouYbt54g
  db-password: &db-password kairon-local-db-password

services:
  database:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: 5432
      PGPORT: 5432
      POSTGRES_DB: postgres
      PGDATABASE: postgres
      POSTGRES_PASSWORD: *db-password
      PGPASSWORD: *db-password
    volumes:
      - ./docker/local/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./supabase/migrations/202610010001_kairon.sql:/docker-entrypoint-initdb.d/migrations/99-kairon.sql:ro
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://supabase-gateway:8000
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:kairon-local-db-password@database:5432/postgres
      GOTRUE_SITE_URL: http://localhost:8080
      # Accounts are created by the seed step only; nobody can sign up.
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_JWT_SECRET: *jwt-secret
      GOTRUE_JWT_ISSUER: http://supabase-gateway:8000/auth/v1
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  database-api:
    image: postgrest/postgrest:v14.17
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:kairon-local-db-password@database:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: *jwt-secret
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: "*"

  supabase-gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
      database-api:
        condition: service_started
    volumes:
      - ./docker/local/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://database-api:3001/ready && wget -q --spider http://127.0.0.1:8000/auth/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: .
      target: api
    restart: unless-stopped
    depends_on:
      supabase-gateway:
        condition: service_healthy
    command: ["sh", "scripts/docker-start.sh"]
    volumes:
      # Drop the competition CSVs and catalog.json into ./data; they are imported on start.
      - ./data:/app/data:ro
    environment:
      PORT: 8080
      LOG_LEVEL: info
      SUPABASE_URL: http://supabase-gateway:8000
      SUPABASE_PUBLISHABLE_KEY: *anon-key
      SUPABASE_SECRET_KEY: *service-key
      SUPABASE_JWT_SECRET: *jwt-secret
      WEB_ORIGIN: http://localhost:8080,https://localhost
      # Demo accounts (all depot Peliyagoda). Change them before exposing this stack to anyone.
      SEED_DISPATCHER_EMAIL: dispatcher@kairon.local
      SEED_DISPATCHER_PASSWORD: kairon-demo-2026
      SEED_DISPATCHER_DEPOT: Peliyagoda
      SEED_LOADER_EMAIL: loader@kairon.local
      SEED_LOADER_PASSWORD: kairon-demo-2026
      SEED_LOADER_DEPOT: Peliyagoda
      SEED_DRIVER_EMAIL: driver@kairon.local
      SEED_DRIVER_PASSWORD: kairon-demo-2026
      SEED_DRIVER_DEPOT: Peliyagoda
      SEED_DRIVER_VEHICLE: ${SEED_DRIVER_VEHICLE:-}
      SEED_STORE_EMAIL: store@kairon.local
      SEED_STORE_PASSWORD: kairon-demo-2026
      SEED_STORE_DEPOT: Peliyagoda
      SEED_STORE_OUTLET: ${SEED_STORE_OUTLET:-}

  frontend:
    build:
      context: .
      target: frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"

volumes:
  db-data:
  db-config:
