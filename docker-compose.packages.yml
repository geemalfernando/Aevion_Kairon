# Run published demo images: docker compose -f docker-compose.packages.yml up
# For a private package, sign in to ghcr.io first; see README.md.
name: kairon

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kairon
      POSTGRES_USER: kairon
      POSTGRES_PASSWORD: kairon
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U kairon -d kairon]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    image: ghcr.io/geemalfernando/kairon-demo-api:${KAIRON_IMAGE_TAG:-latest}
    pull_policy: always
    depends_on:
      database:
        condition: service_healthy
    environment:
      PORT: 8080
      BACKEND: postgres
      DEPLOYMENT_ENV: development
      ENV_FILE: .env.docker-unused
      TRUST_PROXY_HOPS: 1
      DATABASE_URL: postgres://kairon:kairon@database:5432/kairon
      AUTH_SECRET: ${AUTH_SECRET:-kairon-local-demo-secret-change-me}
      DEMO_MODE: 'true'
      SEED_DEMO_DAY: 'true'
      SEED_DEMO_EVERY_START: 'true'
      DATA_DIR: /app/data
      WEB_ORIGIN: http://localhost:${APP_PORT:-8080}
      LOG_LEVEL: info
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped

  frontend:
    image: ghcr.io/geemalfernando/kairon-demo-web:${KAIRON_IMAGE_TAG:-latest}
    pull_policy: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${APP_PORT:-8080}:80'
    restart: unless-stopped

volumes:
  db-data:
