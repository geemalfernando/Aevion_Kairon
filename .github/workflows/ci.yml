# Automated checks for every push and pull request:
# API tests and typecheck, web lint and build, the Docker stack with a 4-role walkthrough,
# Android and iOS app builds, and a smoke test of production.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24
  # The hosted API the mobile apps talk to.
  PRODUCTION_URL: https://d10j8dr2q1dn87.cloudfront.net

jobs:
  server:
    name: API · typecheck and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Run all API tests
        run: npm run test:ci
      - name: List every test in the run summary
        if: always() && hashFiles('server/test-results.xml') != ''
        run: node scripts/test-summary.mjs test-results.xml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('server/test-results.xml') != ''
        with:
          name: api-test-results
          path: server/test-results.xml
          retention-days: 14
      - name: Bundle the Vercel function
        run: npm run bundle:vercel
      - run: npm run test:notifications:db
      - name: Verify RDS authentication, permissions and atomic commits
        run: npm run test:rds

  web:
    name: Web · lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker · local stack and 4-role walkthrough
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Start PostgreSQL and the app from a clean state
        run: docker compose up --build --detach --wait
      - name: Walk through the delivery day as all four roles
        working-directory: server
        run: npm ci && npm run test:walkthrough
        env:
          API_URL: http://localhost:8080
      - name: Verify HTTP security
        working-directory: server
        run: npm run test:security
        env:
          API_URL: http://localhost:8080
      - name: App logs
        if: failure()
        run: docker compose logs backend frontend
      - if: always()
        run: docker compose down --volumes

  android:
    name: Android · build APK
    needs: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Build web bundle and sync Android project
        run: npm run build:android
        env:
          VITE_API_URL: ${{ env.PRODUCTION_URL }}
      - name: Assemble debug APK
        working-directory: web/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Kairon-android-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  ios:
    # macOS minutes cost 10x on private repositories, so this runs on main and on demand only.
    name: iOS · simulator build
    if: github.event_name != 'pull_request'
    needs: web
    runs-on: macos-15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build web bundle and sync iOS project
        run: npm run build:ios
        env:
          VITE_API_URL: ${{ env.PRODUCTION_URL }}
      - name: Compile for iOS Simulator (unsigned)
        working-directory: web/ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -destination 'generic/platform=iOS Simulator' -configuration Debug CODE_SIGNING_ALLOWED=NO build

  smoke:
    name: Production · smoke test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Health, auth guard and APK download
        run: |
          set -eu
          curl -fsS "$PRODUCTION_URL/api/health" | grep -q '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' "$PRODUCTION_URL/api/state")" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' "$PRODUCTION_URL/login")" = 200
          curl -fsSI "$PRODUCTION_URL/downloads/Kairon.apk" | grep -qi 'application/vnd.android.package-archive'
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Sign in as every AWS judge role
        working-directory: server
        run: npm ci && npm run test:smoke
        env:
          API_URL: ${{ env.PRODUCTION_URL }}
          SEED_DISPATCHER_EMAIL: dispatcher@kairon.demo
          SEED_DISPATCHER_PASSWORD: kairon2026
          SEED_LOADER_EMAIL: loader@kairon.demo
          SEED_LOADER_PASSWORD: kairon2026
          SEED_DRIVER_EMAIL: driver@kairon.demo
          SEED_DRIVER_PASSWORD: kairon2026
          SEED_STORE_EMAIL: store@kairon.demo
          SEED_STORE_PASSWORD: kairon2026
