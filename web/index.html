<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kairon" />
    <meta name="theme-color" content="#106C6C" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Kairon — delivery planning for Waypoint Group: orders, planning, loading, delivery and receipt in one operation that keeps working offline." />
    <title>Kairon — Waypoint delivery planning</title>
    <script>
      // Apply the theme before first paint. Drivers default to the night theme (Fresh runs leave at 03:30);
      // every other role starts light. ?theme= overrides it for previews.
      try {
        var q = new URLSearchParams(location.search).get('theme');
        var raw = sessionStorage.getItem('kairon-session') || localStorage.getItem('kairon-session');
        var role = raw ? (JSON.parse(raw).state || {}).user : null;
        role = role ? role.role : location.pathname.indexOf('/driver') === 0 ? 'DRIVER' : null;
        var t = q || (role && localStorage.getItem('kairon-theme:' + role)) || (role === 'DRIVER' ? 'dark' : 'light');
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
