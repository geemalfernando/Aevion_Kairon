AWSTemplateFormatVersion: '2010-09-09'
Description: Kairon AWS staging foundation. Existing VPC, TLS certificate and Supabase secret required. Push image before setting DesiredCount above zero.
Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two public subnets in different availability zones.
  PrivateSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two private subnets with NAT egress to Supabase and AWS APIs.
  CertificateArn:
    Type: String
    Description: Issued ACM certificate in this stack's region covering AppOrigin's hostname.
  AppOrigin:
    Type: String
    AllowedPattern: 'https://[a-zA-Z0-9.-]+'
    Description: Exact HTTPS origin, without a trailing slash or path.
  SupabaseUrl:
    Type: String
    AllowedPattern: 'https://[a-zA-Z0-9.-]+'
  SupabaseSecretArn:
    Type: String
    Description: Secrets Manager JSON secret with publishableKey, secretKey and mediaSigningKey. Use the default aws/secretsmanager encryption key.
  ImageTag:
    Type: String
    Default: initial
    AllowedPattern: '[a-zA-Z0-9_.-]+'
  DesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 4
    Description: Zero for infrastructure bootstrap; set to two after pushing an image.
Resources:
  Repository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      EncryptionConfiguration: { EncryptionType: AES256 }
  Logs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RetentionInDays: 30
  Alerts:
    Type: AWS::SNS::Topic
  NotificationDLQ:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600
  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      ReceiveMessageWaitTimeSeconds: 20
      VisibilityTimeout: 120
      MessageRetentionPeriod: 345600
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationDLQ.Arn
        maxReceiveCount: 5
  QueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref NotificationQueue, !Ref NotificationDLQ]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: sqs:*
            Resource: [!GetAtt NotificationQueue.Arn, !GetAtt NotificationDLQ.Arn]
            Condition:
              Bool: { 'aws:SecureTransport': 'false' }
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SupabaseSecretOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SupabaseSecretArn
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      # The current app makes no AWS SDK calls. Add resource-scoped permissions when workers exist.
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS ingress only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 10.0.0.0/8
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 172.16.0.0/12
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 192.168.0.0/16
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: API ingress only from the ALB; HTTPS egress for Supabase and AWS
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets: !Ref PublicSubnets
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '60'
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 30
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
  WebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Scope: REGIONAL
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        SampledRequestsEnabled: false
        MetricName: !Sub ${AWS::StackName}-waf
      Rules:
        - Name: CommonThreats
          Priority: 0
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              RuleActionOverrides:
                # Proof photos exceed the managed 8KB size rule. Fastify enforces a 12MB request limit.
                - Name: SizeRestrictions_BODY
                  ActionToUse: { Count: {} }
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            SampledRequestsEnabled: false
            MetricName: CommonThreats
        - Name: LoginRate
          Priority: 1
          Action: { Block: {} }
          Statement:
            RateBasedStatement:
              Limit: 100
              AggregateKeyType: IP
              ScopeDownStatement:
                ByteMatchStatement:
                  FieldToMatch: { UriPath: {} }
                  PositionalConstraint: STARTS_WITH
                  SearchString: /api/auth/
                  TextTransformations:
                    - Priority: 0
                      Type: NONE
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            SampledRequestsEnabled: false
            MetricName: LoginRate
  WafAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref LoadBalancer
      WebACLArn: !GetAtt WebACL.Arn
  Task:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: app
          Image: !Sub ${Repository.RepositoryUri}:${ImageTag}
          Essential: true
          User: '1000'
          ReadonlyRootFilesystem: true
          StopTimeout: 30
          PortMappings:
            - ContainerPort: 8080
          Environment:
            - { Name: DEPLOYMENT_ENV, Value: staging }
            - { Name: TRUST_PROXY_HOPS, Value: '1' }
            - { Name: DEMO_MODE, Value: 'false' }
            - { Name: SEED_DEMO_DAY, Value: 'false' }
            - { Name: PORT, Value: '8080' }
            - { Name: WEB_ORIGIN, Value: !Ref AppOrigin }
            - { Name: PUBLIC_API_URL, Value: !Ref AppOrigin }
            - { Name: SUPABASE_URL, Value: !Ref SupabaseUrl }
            - { Name: STREAM_MAX_MS, Value: '240000' }
            # tsx uses temporary caching by default; read-only containers must disable it.
            - { Name: TSX_DISABLE_CACHE, Value: '1' }
          Secrets:
            - Name: SUPABASE_PUBLISHABLE_KEY
              ValueFrom: !Sub '${SupabaseSecretArn}:publishableKey::'
            - Name: SUPABASE_SECRET_KEY
              ValueFrom: !Sub '${SupabaseSecretArn}:secretKey::'
            - Name: MEDIA_SIGNING_KEY
              ValueFrom: !Sub '${SupabaseSecretArn}:mediaSigningKey::'
          HealthCheck:
            Command: [CMD-SHELL, 'wget -qO- http://127.0.0.1:8080/api/health || exit 1']
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref Logs
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
  Service:
    Type: AWS::ECS::Service
    DependsOn: [Listener, WafAssociation]
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      PlatformVersion: '1.4.0'
      TaskDefinition: !Ref Task
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref PrivateSubnets
          SecurityGroups: [!Ref AppSecurityGroup]
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup
  ServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      AlarmActions: [!Ref Alerts]
  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: QueueName
          Value: !GetAtt NotificationDLQ.QueueName
      AlarmActions: [!Ref Alerts]
Outputs:
  RepositoryUri: { Value: !GetAtt Repository.RepositoryUri }
  LoadBalancerDns: { Value: !GetAtt LoadBalancer.DNSName }
  LoadBalancerHostedZoneId: { Value: !GetAtt LoadBalancer.CanonicalHostedZoneID }
  ClusterName: { Value: !Ref Cluster }
  ServiceName: { Value: !GetAtt Service.Name }
  AlertTopicArn: { Value: !Ref Alerts }
  NotificationQueueUrl: { Value: !Ref NotificationQueue }
  NotificationDLQUrl: { Value: !Ref NotificationDLQ }
