# Local Docker stack only: the two Supabase paths the Kairon API uses, on one origin like hosted Supabase.
server {
  listen 8000;
  client_max_body_size 20m;

  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
  }

  location /rest/v1/ {
    proxy_pass http://database-api:3000/;
    proxy_set_header Host $host;
  }
}
