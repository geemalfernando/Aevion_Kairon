# Frontend container: serves the built web app and forwards /api to the backend on the same origin.
server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 20m;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Live updates are server-sent events: no buffering, long-lived connections.
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # The app shell and service worker must always be revalidated, so a rebuilt image is picked up.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # Hashed build assets never change.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Android app download from the landing page.
  location /downloads/ {
    types { application/vnd.android.package-archive apk; }
    add_header Content-Disposition "attachment";
  }

  # Client-side routes fall back to the app shell.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
